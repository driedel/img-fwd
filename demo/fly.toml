app = "img-fwd-demo-static"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[[services]]
  internal_port = 80
  protocol = "tcp"
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1
  
  [[services.ports]]
    handlers = ["http"]
    port = 80

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"